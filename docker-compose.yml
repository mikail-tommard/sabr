services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sabr
      POSTGRES_USER: sabr
      POSTGRES_PASSWORD: sabr
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabr -d sabr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ADDR: ":8080"
      DB_DSN: postgres://sabr:sabr@postgres:5432/sabr?sslmode=disable
      JWT_SECRET: dev-secret
      USERS_SERVICE_URL: http://users:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ./api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  postgres_data:
